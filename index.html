<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Simple Chat Website</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #e5ddd5;
    margin: 0;
}

.chat-container {
    max-width: 400px;
    margin: 20px auto;
    background: white;
    height: 85vh;
    display: flex;
    flex-direction: column;
    border-radius: 8px;
    overflow: hidden;
}

.chat-box {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
}

.msg {
    padding: 10px;
    border-radius: 8px;
    margin: 5px;
    background: #dcf8c6;
    width: fit-content;
}

.input-area {
    display: flex;
    padding: 10px;
}

input {
    flex: 1;
    padding: 10px;
}

button {
    padding: 10px;
}
</style>

</head>

<body>

<div class="chat-container">

<div class="chat-box" id="chatBox">
<div class="msg">Welcome! Type a message below.</div>
</div>

<div class="input-area">
<input type="text" id="msgInput" placeholder="Type message...">
<button onclick="sendMsg()">➤</button>
</div>

</div>

<script>
function sendMsg(){

let input = document.getElementById("msgInput");
let text = input.value;

if(text=="") return;

let box = document.getElementById("chatBox");

let msg = document.createElement("div");
msg.className="msg";
msg.innerHTML=text;

box.appendChild(msg);

input.value="";

box.scrollTop=box.scrollHeight;

}
</script>

  };

  const analytics = getAnalytics(app);
</script>
</body>
</html>
