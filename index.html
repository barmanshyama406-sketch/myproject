
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Simple Chat</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <!-- Login Screen -->

  <div id="loginBox">

    <h2>Login</h2>

    <input 
      type="text" 
      id="phone" 
      placeholder="Enter phone number">

    <div id="recaptcha-container"></div>

    <button id="sendOtp">
      Send OTP
    </button>

    <input 
      type="text" 
      id="otp" 
      placeholder="Enter OTP">

    <button id="verifyOtp">
      Verify OTP
    </button>

  </div>



  <!-- Chat Screen -->

  <div id="chatBox" style="display:none;">

    <h1>Simple Chat</h1>

    <div id="chat"></div>


    <div class="input-box">

      <input 
        type="text" 
        id="username" 
        placeholder="Your name">


      <input 
        type="text" 
        id="message" 
        placeholder="Type a message">


      <button id="sendBtn">
        Send
      </button>

    </div>

  </div>


</div>


<script type="module" src="script.js"></script>

</body>

</html>
