<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Simple Chat Website</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #e5ddd5;
    margin: 0;
}

.chat-container {
    max-width: 400px;
    margin: 20px auto;
    background: white;
    height: 85vh;
    display: flex;
    flex-direction: column;
    border-radius: 8px;
    overflow: hidden;
}

.chat-box {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.msg {
    padding: 10px;
    border-radius: 8px;
    max-width: 70%;
}

.sent {
    background: #dcf8c6;
    align-self: flex-end;
}

.received {
    background: #ffffff;
    align-self: flex-start;
}

.input-area {
    display: flex;
    padding: 10px;
    background: #f0f0f0;
}

input {
    flex: 1;
    padding: 10px;
    border-radius: 5px;
    border: 1px solid #ccc;
}

button {
    padding: 10px 15px;
    margin-left: 5px;
    border: none;
    background: green;
    color: white;
    border-radius: 5px;
}
</style>

</head>

<body>

<div class="chat-container">

<div class="chat-box" id="chatBox">
    <div class="msg received">
        Welcome! Type a message below.
    </div>
</div>

<div class="input-area">
    <input type="text" id="msgInput" placeholder="Type message...">
    <button onclick="sendMsg()">➤</button>
</div>

</div>


<script>

function sendMsg(){

    let input = document.getElementById("msgInput");
    let text = input.value;

    if(text=="") return;

    let box = document.getElementById("chatBox");

    let msg = document.createElement("div");
    msg.className = "msg sent";
    msg.innerHTML = text;

    box.appendChild(msg);

    input.value="";

    box.scrollTop = box.scrollHeight;
}

</script>

</body>
</html>
